<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>写真に日付を入れる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --ink:#1C2A33; --muted:#4E5D66; --line:#C3CDCB;
  --action:#1F6B66; --action-ink:#FFFFFF; --action-soft:#DCEBE9; --lcd:#20262B; --led:#FF8A1F;
  --warn:#8A4B00; --warn-bg:#FFF1DE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12181C; --surface:#1B2328; --ink:#E8EDEC; --muted:#A8B5BA; --line:#36444C;
    --action:#5BBDB3; --action-ink:#0B1A19; --action-soft:#203B39; --lcd:#0B0E10;
    --warn:#FFC27A; --warn-bg:#3A2A16;
  }
}
:root[data-theme="dark"]{
  --bg:#12181C; --surface:#1B2328; --ink:#E8EDEC; --muted:#A8B5BA; --line:#36444C;
  --action:#5BBDB3; --action-ink:#0B1A19; --action-soft:#203B39; --lcd:#0B0E10;
  --warn:#FFC27A; --warn-bg:#3A2A16;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:19px; line-height:1.75; font-weight:500;
  -webkit-text-size-adjust:100%;
}
main{max-width:560px; margin:0 auto; padding:20px 18px 48px}

.lcd{
  background:var(--lcd); border-radius:14px; padding:14px 18px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.lcd canvas{height:44px; width:auto; display:block}
.lcd small{color:#9AA6AD; font-size:14px; line-height:1.4}
h1{font-size:30px; line-height:1.35; margin:22px 0 6px; font-weight:700; letter-spacing:.02em}
.lead{margin:0 0 6px; color:var(--muted)}
.privacy{font-size:16px; color:var(--muted); margin:0 0 26px}

section.step{
  background:var(--surface); border:2px solid var(--line); border-radius:18px;
  padding:20px 18px 22px; margin-bottom:18px;
}
.step h2{display:flex; align-items:center; gap:12px; font-size:22px; margin:0 0 14px; font-weight:700; line-height:1.4}
.num{
  flex:none; width:38px; height:38px; border-radius:50%;
  background:var(--action); color:var(--action-ink);
  display:grid; place-items:center; font-size:20px; font-weight:700;
}
.hidden{display:none !important}

.btn{
  display:flex; align-items:center; justify-content:center; width:100%;
  min-height:62px; padding:12px 18px; border-radius:14px; border:none;
  background:var(--action); color:var(--action-ink);
  font:inherit; font-size:21px; font-weight:700; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:translateY(1px)}
.btn.sub{background:transparent; color:var(--action); border:2px solid var(--action); min-height:54px; font-size:18px}
.btn:focus-visible, .choice input:focus-visible + span, input[type=date]:focus-visible{
  outline:3px solid var(--led); outline-offset:3px;
}
input[type=file]{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}

.note{border-radius:12px; padding:12px 14px; margin:14px 0 0; font-size:17px; line-height:1.6}
.note.ok{background:var(--action-soft)}
.note.warn{background:var(--warn-bg); color:var(--warn)}

label.field{display:block; font-size:17px; color:var(--muted); margin:0 0 6px}
input[type=date]{
  width:100%; min-height:60px; padding:10px 14px; border-radius:12px;
  border:2px solid var(--line); background:var(--bg); color:var(--ink);
  font:inherit; font-size:22px; font-weight:700;
}

.group{margin-top:20px}
.group > p{margin:0 0 8px; font-size:17px; color:var(--muted)}
.choices{display:grid; gap:10px}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choice{position:relative; display:block}
.choice input{position:absolute; opacity:0; inset:0; margin:0}
.choice span{
  display:flex; flex-direction:column; justify-content:center; gap:2px;
  min-height:58px; padding:10px 14px; border-radius:12px;
  border:2px solid var(--line); background:var(--bg); cursor:pointer; line-height:1.4;
}
.choices.three .choice span{align-items:center; text-align:center; font-size:20px; font-weight:700}
.choice span b{font-size:19px}
.choice span em{font-style:normal; font-size:16px; color:var(--muted)}
.choice input:checked + span{border-color:var(--action); background:var(--action-soft); box-shadow:inset 0 0 0 2px var(--action)}

.preview{margin-top:20px; border-radius:12px; overflow:hidden; background:var(--lcd)}
.preview canvas, .preview img{display:block; width:100%; height:auto}

.saved-img{margin-top:14px; border-radius:12px; overflow:hidden}
.saved-img img{display:block; width:100%; height:auto; -webkit-touch-callout:default}
.stack{display:grid; gap:12px}

@media (prefers-reduced-motion:reduce){ .btn:active{transform:none} }
</style>
</head>
<body>
<main>
  <div class="lcd" aria-hidden="true">
    <canvas id="lcd" width="320" height="88"></canvas>
    <small>むかしの<br>カメラ風</small>
  </div>

  <h1>写真に日付を入れる</h1>
  <p class="lead">スマホの写真の右下に、撮った日付を入れます。</p>
  <p class="privacy">写真はこのスマホの中だけで処理され、どこにも送られません。</p>

  <section class="step" id="step1">
    <h2><span class="num">1</span>写真をえらぶ</h2>
    <input type="file" id="file" accept="image/*">
    <button class="btn" id="pick" type="button">写真をえらぶ</button>
    <p class="note warn hidden" id="loadError" role="alert"></p>
  </section>

  <section class="step hidden" id="step2">
    <h2><span class="num">2</span>日付と入れ方をえらぶ</h2>
    <label class="field" for="date">入れる日付</label>
    <input type="date" id="date">
    <p class="note" id="dateNote" role="status"></p>

    <div class="group" role="radiogroup" aria-label="入れ方">
      <p>入れ方</p>
      <div class="choices">
        <label class="choice"><input type="radio" name="style" value="film" checked><span><b>むかしのカメラ風</b><em>オレンジの数字　'24 4 5</em></span></label>
        <label class="choice"><input type="radio" name="style" value="num"><span><b>白い数字</b><em>2024.4.5</em></span></label>
        <label class="choice"><input type="radio" name="style" value="kanji"><span><b>白い文字（年月日）</b><em>2024年4月5日</em></span></label>
      </div>
    </div>

    <div class="group" role="radiogroup" aria-label="文字の大きさ">
      <p>文字の大きさ</p>
      <div class="choices three">
        <label class="choice"><input type="radio" name="size" value="s"><span>小</span></label>
        <label class="choice"><input type="radio" name="size" value="m" checked><span>中</span></label>
        <label class="choice"><input type="radio" name="size" value="l"><span>大</span></label>
      </div>
    </div>

    <div class="preview"><canvas id="out" aria-label="日付を入れた写真の見本"></canvas></div>
  </section>

  <section class="step hidden" id="step3">
    <h2><span class="num">3</span>保存する</h2>
    <div class="stack">
      <button class="btn" id="save" type="button">この写真を保存する</button>
      <button class="btn sub" id="again" type="button">別の写真をえらぶ</button>
    </div>
    <p class="note ok hidden" id="saveNote" role="status"></p>
    <div class="saved-img hidden" id="savedWrap"><img id="savedImg" alt="日付を入れた写真"></div>
  </section>
</main>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var fileInput = $("file"), out = $("out"), ctx = out.getContext("2d");
  var img = null, baseName = "photo", downloads = null, downloadsChecked = false;
  var MAX_PIXELS = 16000000;

  /* ---------- 7セグメント数字（むかしのカメラ風） ---------- */
  var SEG = {"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg"};
  function segRects(x, y, w, h, t){
    var hh = h/2 - 1.5*t;
    return {
      a:[x+t, y, w-2*t, t], b:[x+w-t, y+t, t, hh], c:[x+w-t, y+h/2+0.5*t, t, hh],
      d:[x+t, y+h-t, w-2*t, t], e:[x, y+h/2+0.5*t, t, hh], f:[x, y+t, t, hh],
      g:[x+t, y+h/2-t/2, w-2*t, t]
    };
  }
  // tokens: digits, "'" apostrophe, "_" blank digit, " " separator
  function sevenSeg(c, text, rightX, baseY, h, draw){
    var w = h*0.56, t = h*0.13, gap = h*0.17, sep = h*0.42;
    var width = 0, i, ch;
    for(i=0;i<text.length;i++){
      ch = text[i];
      if(ch === "'") width += t + gap;
      else if(ch === " ") width += sep;
      else width += w + gap;
    }
    width -= gap;
    if(!draw) return width;
    var x = rightX - width, y = baseY - h;
    c.save();
    // 少し斜めにして本物らしく
    c.translate(x, y + h); c.transform(1,0,-0.08,1,0,0); c.translate(-x, -(y + h));
    for(i=0;i<text.length;i++){
      ch = text[i];
      if(ch === "'"){ c.fillRect(x, y, t, h*0.3); x += t + gap; continue; }
      if(ch === " "){ x += sep; continue; }
      if(SEG[ch]){
        var r = segRects(x, y, w, h, t), s = SEG[ch];
        for(var k=0;k<s.length;k++){ var q = r[s[k]]; c.fillRect(q[0], q[1], q[2], q[3]); }
      }
      x += w + gap;
    }
    c.restore();
    return width;
  }
  function drawLed(c, text, rightX, baseY, h){
    c.save();
    c.fillStyle = "#FF8A1F";
    c.shadowColor = "rgba(255,110,10,0.9)";
    c.shadowBlur = h*0.35;
    sevenSeg(c, text, rightX, baseY, h, true);
    c.shadowBlur = 0;
    c.fillStyle = "#FFB066";
    sevenSeg(c, text, rightX, baseY, h, true);
    c.restore();
  }

  /* ---------- 日付の文字列 ---------- */
  function parts(){
    var v = $("date").value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return null;
    var p = v.split("-");
    return {y:+p[0], m:+p[1], d:+p[2]};
  }
  function filmText(p){
    var yy = String(p.y % 100); if(yy.length < 2) yy = "0" + yy;
    var f = function(n){ return n < 10 ? "_" + n : String(n); };
    return "'" + yy + " " + f(p.m) + " " + f(p.d);
  }

  /* ---------- ヘッダーの表示 ---------- */
  (function(){
    var c = $("lcd").getContext("2d"), now = new Date();
    drawLed(c, filmText({y:now.getFullYear(), m:now.getMonth()+1, d:now.getDate()}), 300, 70, 52);
  })();

  /* ---------- 写真の撮影日（EXIF）を読む ---------- */
  function readExifDate(buf){
    try{
      var v = new DataView(buf);
      if(v.getUint16(0) !== 0xFFD8) return null;
      var off = 2;
      while(off + 4 < v.byteLength){
        var marker = v.getUint16(off);
        if((marker & 0xFF00) !== 0xFF00) return null;
        var size = v.getUint16(off + 2);
        if(marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966 && v.getUint16(off + 8) === 0){
          return parseTiff(v, off + 10);
        }
        if(marker === 0xFFDA) break;
        off += 2 + size;
      }
    }catch(e){}
    return null;
  }
  function parseTiff(v, t){
    var le = v.getUint16(t) === 0x4949;
    var g16 = function(o){ return v.getUint16(o, le); };
    var g32 = function(o){ return v.getUint32(o, le); };
    function readIFD(ifdOff){
      var map = {}, n = g16(t + ifdOff);
      for(var i=0;i<n;i++){
        var e = t + ifdOff + 2 + i*12;
        var tag = g16(e), type = g16(e+2), count = g32(e+4);
        if(type === 4 || type === 13){ map[tag] = g32(e+8); }
        else if(type === 2){
          var so = count > 4 ? t + g32(e+8) : e + 8, s = "";
          for(var j=0;j<count-1;j++) s += String.fromCharCode(v.getUint8(so + j));
          map[tag] = s;
        }
      }
      return map;
    }
    var ifd0 = readIFD(g32(t + 4)), dt = null;
    if(ifd0[0x8769]){ var ex = readIFD(ifd0[0x8769]); dt = ex[0x9003] || ex[0x9004]; }
    dt = dt || ifd0[0x0132];
    var m = dt && /^(\d{4}):(\d{2}):(\d{2})/.exec(dt);
    if(!m || +m[1] < 1900 || m[2] === "00") return null;
    return m[1] + "-" + m[2] + "-" + m[3];
  }

  /* ---------- 描画 ---------- */
  function radio(name){ var el = document.querySelector('input[name="'+name+'"]:checked'); return el ? el.value : null; }
  var SIZE = {s:0.03, m:0.045, l:0.065};

  function render(){
    if(!img) return;
    var w = img.naturalWidth, h = img.naturalHeight;
    var scale = Math.min(1, Math.sqrt(MAX_PIXELS / (w*h)));
    w = Math.round(w*scale); h = Math.round(h*scale);
    out.width = w; out.height = h;
    ctx.drawImage(img, 0, 0, w, h);

    var p = parts(); if(!p) return;
    var short = Math.min(w, h), capH = short * SIZE[radio("size") || "m"];
    var margin = short * 0.04, right = w - margin, base = h - margin;
    var style = radio("style");

    if(style === "film"){
      drawLed(ctx, filmText(p), right, base, capH);
    } else {
      var text = style === "kanji" ? (p.y + "年" + p.m + "月" + p.d + "日") : (p.y + "." + p.m + "." + p.d);
      ctx.save();
      ctx.font = '700 ' + Math.round(capH*1.4) + 'px "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif';
      ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
      ctx.lineJoin = "round";
      ctx.lineWidth = capH*0.16;
      ctx.strokeStyle = "rgba(0,0,0,0.55)";
      ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = capH*0.3;
      ctx.strokeText(text, right, base);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(text, right, base);
      ctx.restore();
    }
    $("savedWrap").classList.add("hidden");
    $("saveNote").classList.add("hidden");
  }

  /* ---------- 写真の読み込み ---------- */
  $("pick").addEventListener("click", function(){ fileInput.value = ""; fileInput.click(); });
  $("again").addEventListener("click", function(){ fileInput.value = ""; fileInput.click(); });

  fileInput.addEventListener("change", function(){
    var f = fileInput.files && fileInput.files[0];
    if(!f) return;
    $("loadError").classList.add("hidden");
    baseName = (f.name || "photo").replace(/\.[^.]+$/, "") || "photo";

    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function(){
      img = im;
      f.slice(0, 256*1024).arrayBuffer().then(function(buf){
        var found = readExifDate(buf), note = $("dateNote");
        if(found){
          $("date").value = found;
          note.className = "note ok";
          note.textContent = "写真から撮影日を読み取りました。違うときは上の日付を変えてください。";
        } else {
          if(!$("date").value){
            var n = new Date();
            $("date").value = n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,"0") + "-" + String(n.getDate()).padStart(2,"0");
          }
          note.className = "note warn";
          note.textContent = "この写真には撮影日の記録がありませんでした（LINEで受け取った写真などによくあります）。上の日付をタップして、入れたい日を選んでください。";
        }
        $("step2").classList.remove("hidden");
        $("step3").classList.remove("hidden");
        fontsReady.then(render);
        $("step2").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
      });
    };
    im.onerror = function(){
      var e = $("loadError");
      e.textContent = "この写真は読み込めませんでした。別の写真を選ぶか、写真アプリで「JPEG」形式にしてからお試しください。";
      e.classList.remove("hidden");
      URL.revokeObjectURL(url);
    };
    im.src = url;
  });

  var fontsReady = (document.fonts && document.fonts.load)
    ? Promise.race([document.fonts.load('700 40px "Zen Maru Gothic"'), new Promise(function(r){ setTimeout(r, 2500); })]).catch(function(){})
    : Promise.resolve();

  $("date").addEventListener("change", function(){ fontsReady.then(render); });
  $("date").addEventListener("input", function(){ fontsReady.then(render); });
  document.querySelectorAll('input[name="style"],input[name="size"]').forEach(function(el){
    el.addEventListener("change", function(){ fontsReady.then(render); });
  });

  /* ---------- 保存（一般のWebサイト用） ---------- */
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  function note(cls, msg){
    var n = $("saveNote"); n.className = "note " + cls; n.textContent = msg;
  }
  function showLongPress(blob){
    $("savedImg").src = URL.createObjectURL(blob);
    $("savedWrap").classList.remove("hidden");
  }

  $("save").addEventListener("click", function(){
    if(!img) return;
    var p = parts();
    var stamp = p ? (p.y + String(p.m).padStart(2,"0") + String(p.d).padStart(2,"0")) : "";
    var filename = baseName + "_日付入り" + (stamp ? "_" + stamp : "") + ".jpg";
    out.toBlob(function(blob){
      if(!blob) return;
      var file = null;
      try{ file = new File([blob], filename, {type:"image/jpeg"}); }catch(e){}

      // iPhone・iPad：共有メニューから「画像を保存」で写真アプリへ
      if(isIOS && file && navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file]}).then(function(){
          note("ok", "保存できたら、写真アプリの最近の項目に入っています。");
        }).catch(function(err){
          if(err && err.name === "AbortError"){
            note("warn", "保存はキャンセルされました。もう一度「この写真を保存する」を押すとやり直せます。");
          } else {
            showLongPress(blob);
            note("ok", "下の写真を指で長押しして「写真に保存」を選んでください。");
          }
        });
        note("ok", "出てきたメニューで「画像を保存」を選んでください。");
        return;
      }

      // Android・パソコン：ダウンロードとして保存
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      showLongPress(blob);
      note("ok", "「ダウンロード」に保存しました。フォトアプリの「ライブラリ」→「Download」から見られます。うまく保存できないときは、下の写真を長押しして「画像をダウンロード」を選んでください。");
    }, "image/jpeg", 0.92);
  });
})();
</script>
</body>
</html>
